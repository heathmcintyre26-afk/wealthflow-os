name = "wealthflow-os"
main = "index.js"
compatibility_date = "2026-08-20"
type = "service"

[[routes]]
pattern = "thewealthflow.xyz"
custom_domain = true

[env.production]
vars = { ENVIRONMENT = "production" }

[env.staging]
vars = { ENVIRONMENT = "staging" }

[env.development]
vars = { ENVIRONMENT = "development" }

# Analytics Engine (optional)
[analytics]
enabled = true

# Rate Limiting
[limits]
cpu_milliseconds = 50000
